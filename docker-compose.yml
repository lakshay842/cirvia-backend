services:
  postgres:
    image: postgres:16-alpine
    container_name: cirvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cirvia
      POSTGRES_PASSWORD: cirvia_secret
      POSTGRES_DB: cirvia_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cirvia -d cirvia_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cirvia-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: cirvia-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev

  mailpit:
    image: axllent/mailpit:latest
    container_name: cirvia-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    profiles:
      - dev

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cirvia-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cirvia:cirvia_secret@postgres:5432/cirvia_db?schema=public
      DIRECT_URL: postgresql://cirvia:cirvia_secret@postgres:5432/cirvia_db?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
